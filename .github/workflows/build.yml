name: Build S23+ (dm2q) Kernel

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          # Using the Samsung SM8550 source you provided
          kernel-url: https://github.com/samsung-sm8550-cola2261/android_kernel_samsung_sm8550
          kernel-dir: msm-kernel
          kernel-branch: upstream/lineage
          
          # Configuration for S23+ / SM8550
          config: gki_defconfig
          arch: arm64
          android-version: 13
          
          # Toolchain Setup
          aosp-gcc: true
          aosp-clang: true
          aosp-clang-version: r450784d # Updated for SM8550 compatibility
          
          # Features
          ksu: true
          ksu-version: main
          disable-lto: true
          anykernel3: true
